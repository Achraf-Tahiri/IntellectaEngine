name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and smoke-test the container without application network access
        run: python3 scripts/check_container.py

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Verify generated requirements
        run: |
          uv export --frozen --no-dev --no-emit-project --emit-index-url --output-file requirements.txt > /dev/null
          uv export --frozen --no-emit-project --emit-index-url --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Check dependency consistency
        run: uv run --frozen python -m pip check
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff check tests --select E4,E7,E9,F
          uv run --frozen ruff format --check tests
      - name: Test without external services
        run: uv run --frozen pytest
      - name: Build and verify distributions
        run: |
          uv build
          uv run --frozen python scripts/check_distribution.py
      - name: Audit installed dependencies
        # Reviewed embedded-only Chroma exceptions: docs/dependency-security.md.
        run: |
          uv run --frozen pip-audit --local \
            --ignore-vuln CVE-2026-45829 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831
      - name: Audit the base PyTorch release
        # PyPI cannot match the CPU index's +cpu distribution suffix.
        run: |
          uv run --frozen python -c 'from importlib.metadata import version; print("torch==" + version("torch").split("+")[0])' > "$RUNNER_TEMP/torch-audit.txt"
          uv run --frozen pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/torch-audit.txt"
